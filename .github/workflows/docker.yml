name: docker

# Builds the engine image on every pull request and smoke-tests it: the container must start, load its
# models (/api/v1/ready answers 200) and analyse a photograph. On master the image is published to the
# GitHub Container Registry as ghcr.io/<owner>/road-shield:latest and :<commit>.

on:
  pull_request:
    paths: ["Dockerfile", "requirements.txt", "api/**", "pipeline/**", "models/**", "mlops/**", "checkpoints/**",
            ".github/workflows/docker.yml"]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t road-shield:ci .
      - name: Smoke test
        run: |
          docker run -d --name rs -p 8000:8000 -e ROAD_SHIELD_WRITABLE_DIR=/tmp/rs road-shield:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/ready >/dev/null; then break; fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:8000/api/v1/ready
          IMG=$(ls datasets/02_kaggle_pothole_600/real_images/*.jpg | head -1)
          python3 -c "import base64,json,sys; print(json.dumps({'image_base64': base64.b64encode(open(sys.argv[1],'rb').read()).decode()}))" "$IMG" > body.json
          curl -fsS -X POST -H 'Content-Type: application/json' --data @body.json http://127.0.0.1:8000/api/v1/pipeline/deep-audit \
            | python3 -c "import json,sys; r=json.load(sys.stdin); assert 'input_check' in r and 'all_detections' in r, r; print('audit ok', r['input_check'].get('verdict'))"
          curl -fsS http://127.0.0.1:8000/api/v1/mlops/overview | python3 -c "import json,sys; d=json.load(sys.stdin); print('serving', d['serving'])"
      - name: Logs on failure
        if: failure()
        run: docker logs rs | tail -200
      - name: Publish
        if: github.event_name == 'push'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag road-shield:ci ghcr.io/$OWNER/road-shield:latest
          docker tag road-shield:ci ghcr.io/$OWNER/road-shield:${GITHUB_SHA::12}
          docker push ghcr.io/$OWNER/road-shield:latest
          docker push ghcr.io/$OWNER/road-shield:${GITHUB_SHA::12}
