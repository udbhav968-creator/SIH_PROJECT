<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Order — ROAD-SHIELD</title>
<meta name="description" content="Printable repair work order with its seal and history.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root { --ink: #111827; --muted: #6b7280; --line: #d1d5db; --ok: #047857; --bad: #b91c1c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e5e7eb; color: var(--ink); font: 13px/1.5 Inter, system-ui, sans-serif; }
  .sheet { background: #fff; width: 210mm; min-height: 297mm; margin: 18px auto; padding: 16mm 16mm 14mm; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
  .bar { max-width: 210mm; margin: 14px auto 0; display: flex; gap: 8px; justify-content: flex-end; padding: 0 4px; }
  .bar button, .bar a { font: 600 13px Inter, sans-serif; padding: 8px 14px; border-radius: 8px; border: 1px solid #9ca3af;
    background: #fff; color: var(--ink); cursor: pointer; text-decoration: none; }
  .bar .primary { background: #111827; color: #fff; border-color: #111827; }
  header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 6px; }
  .id { font-family: "JetBrains Mono", monospace; font-size: 14px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  td, th { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #f3f4f6; width: 32%; font-weight: 600; }
  .mono { font-family: "JetBrains Mono", monospace; font-size: 11px; word-break: break-all; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-weight: 700; font-size: 11px; border: 1px solid; }
  .ok { color: var(--ok); border-color: var(--ok); } .bad { color: var(--bad); border-color: var(--bad); }
  .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 28px; }
  .sign div { border-top: 1px solid var(--ink); padding-top: 4px; font-size: 12px; color: var(--muted); }
  .foot { margin-top: 18px; font-size: 11px; color: var(--muted); }
  @media print { body { background: #fff; } .bar { display: none; } .sheet { box-shadow: none; margin: 0; width: auto; min-height: 0; padding: 10mm; } }
  @media (max-width: 820px) { .sheet { width: auto; margin: 10px; padding: 18px; min-height: 0; } }
</style>
</head>
<body data-bare>
<div class="bar"><a href="/works">← Works</a><button id="brief">Add engineer's brief</button><button class="primary" onclick="window.print()">Print / save as PDF</button></div>
<div class="sheet" id="sheet"><p>loading…</p></div>

<script src="/web/config.js"></script>
<script src="/web/app.js"></script>
<script>
function esc(t) { return String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
const when = t => t ? new Date(t * 1000).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "—";
const STATUS = { ISSUED: "Issued", ASSIGNED: "Assigned", IN_PROGRESS: "In progress", REPAIRED: "Repaired (awaiting fleet check)",
                 VERIFIED: "Verified by the fleet", REOPENED: "Reopened", CANCELLED: "Cancelled" };
(async () => {
  const id = new URLSearchParams(location.search).get("id") || "";
  const r = await API.get(`/api/v1/works/order?id=${encodeURIComponent(id)}`);
  if (!r.ok) { el("sheet").innerHTML = `<p>Work order ${esc(id)} could not be loaded: ${esc(r.data.error || r.status)}</p>`; return; }
  const o = r.data, wo = o.work_order || {}, c = wo.coordinates;
  document.title = `${o.work_order_id} — Work Order`;
  el("sheet").innerHTML = `
    <header>
      <div><h1>ROAD REPAIR WORK ORDER</h1>
        <div class="small" style="color:var(--muted)">${esc(wo.issuing_authority)}</div></div>
      <div style="text-align:right"><div class="id">${esc(o.work_order_id)}</div>
        <div>${esc(STATUS[o.status] || o.status)}</div></div>
    </header>

    <h2>defect</h2>
    <table>
      <tr><th>Type</th><td>${esc(wo.distress_type)}</td></tr>
      <tr><th>Location</th><td>${c ? `${esc(c.lat)}, ${esc(c.lon)} — <a href="https://www.google.com/maps/search/?api=1&query=${esc(c.lat)},${esc(c.lon)}">map</a>` : "no GPS — order held"}
        <br>Corridor: ${esc(wo.corridor)} · Ledger ref ${esc(o.defect_id)}</td></tr>
      <tr><th>Measured</th><td>${esc(wo.surface_area_sqm)} m² · ${esc(wo.depth_cm)} cm deep · PCI ${esc(wo.pavement_pci)}</td></tr>
    </table>

    <h2>work</h2>
    <table>
      <tr><th>Priority / SLA</th><td>${esc(wo.priority)} · repair within ${esc(wo.sla_resolution_hours)} h of issue
        (due ${esc(when(o.due_at))})</td></tr>
      <tr><th>Specification</th><td>${esc(wo.asphalt_mix)} · ${esc(wo.required_mass_tonnes)} t of mix</td></tr>
      <tr><th>Allocated budget</th><td>${esc(fmt.inr(wo.allocated_budget_inr))}<br><span style="color:var(--muted)">${esc(wo.rate_basis)}</span></td></tr>
      <tr><th>Contractor</th><td>${esc(o.contractor || "not yet assigned")}</td></tr>
    </table>

    <h2>integrity</h2>
    <table>
      <tr><th>Seal (${esc(o.seal_algorithm)})</th><td class="mono">${esc(wo.sha256_cryptographic_seal)}</td></tr>
      <tr><th>Seal check now</th><td><span class="pill ${o.seal_status === "SEAL_VERIFIED_AUTHENTIC" ? "ok" : "bad"}">${esc(o.seal_status)}</span>
        &nbsp;history <span class="pill ${o.history_chain_intact ? "ok" : "bad"}">${o.history_chain_intact ? "INTACT" : "ALTERED"}</span></td></tr>
    </table>

    <h2>history</h2>
    <table>
      <tr><th style="width:24%">When</th><th style="width:22%">Step</th><th>By · note · record hash</th></tr>
      ${o.history.map(h => `<tr><td>${esc(when(h.at))}</td><td>${esc(STATUS[h.status] || h.status)}</td>
        <td>${esc(h.actor)}${h.note ? " · " + esc(h.note) : ""}${h.evidence && h.evidence.contractor ? " · " + esc(h.evidence.contractor) : ""}
        <div class="mono" style="color:var(--muted)">${esc(h.hash)}</div></td></tr>`).join("")}
    </table>

    <div id="briefBox"></div>

    <div class="sign"><div>Issuing engineer — name, signature, date</div><div>Contractor — name, signature, date</div></div>

    <p class="foot">Any change to the quantities or budget above after issue breaks the seal; any edited or removed step
      breaks the history hashes. To check this order, open ${esc(location.origin)}/order?id=${esc(o.work_order_id)}
      or send the order to /api/v1/dispatch/verify-seal. The repair is verified when buses on the route pass over the
      location ${esc(o.passes_needed)} times without seeing the defect again.</p>`;
})();

el("brief").onclick = async () => {
  const id = new URLSearchParams(location.search).get("id") || "";
  const b = el("brief");
  b.disabled = true; b.textContent = "writing…";
  let r = await API.post("/api/v1/assistant/report", { work_order_id: id });
  if (r.status === 401) {
    const k = prompt("Operator key:");
    if (k) { setOperatorKey(k.trim()); r = await API.post("/api/v1/assistant/report", { work_order_id: id }); }
  }
  b.disabled = false; b.textContent = "Rewrite brief";
  const d = r.data || {};
  el("briefBox").innerHTML = !r.ok ? `<p class="foot">${esc(d.error || r.status)}</p>` :
    `<h2>engineer's brief</h2><p style="margin:0;line-height:1.6">${esc(d.text)}</p>
     <p class="foot" style="margin-top:6px">${d.mode === "generated" ? `Written by ${esc(d.provider)} from the fields above; every number in it (in digits) was checked against them and the repair guidance.`
        : d.why ? `Template (a generated draft was not used: ${esc(d.why)}).` : "Written from the fields above (no language model configured)."}
       Repair guidance from: ${esc((d.guidance_sources || []).join("; "))}.</p>`;
};
</script>
</body>
</html>
