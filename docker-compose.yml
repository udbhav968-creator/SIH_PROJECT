# ROAD-SHIELD engine with a persistent ledger.
#
#   docker compose up --build        ->  http://localhost:8000
#
# checkpoints/ (trained models and reports) is mounted from the
# repository; the SQLite ledger lives in a named volume so it survives rebuilds.
# Set ROAD_SHIELD_API_KEY to require a key on write endpoints. Prometheus can scrape
# http://localhost:8000/metrics; /api/v1/ready is the readiness probe.
services:
  engine:
    build: .
    image: road-shield:latest
    ports:
      - "8000:8000"
    environment:
      ROAD_SHIELD_WRITABLE_DIR: /data
      ROAD_SHIELD_MLOPS_DIR: /data/mlops_store          # model registry and training runs survive rebuilds
      ROAD_SHIELD_ACCESS_LOG: "1"
      ROAD_SHIELD_API_KEY: ${ROAD_SHIELD_API_KEY:-}
      ROAD_SHIELD_RATE_LIMIT: ${ROAD_SHIELD_RATE_LIMIT:-60}      # model requests per minute per client
      ROAD_SHIELD_MAX_BODY_MB: ${ROAD_SHIELD_MAX_BODY_MB:-25}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    volumes:
      - ./checkpoints:/app/checkpoints
      - ledger:/data
    restart: unless-stopped
    # Healthcheck (models loaded, not just port open) comes from the Dockerfile.

  # Optional: an MLflow UI for the training runs (docker compose --profile mlflow up). Point training at it with
  # MLFLOW_TRACKING_URI=http://localhost:5000 and `pip install mlflow`; mlops/tracking.py mirrors every run there.
  mlflow:
    profiles: ["mlflow"]
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow:/mlflow
    restart: unless-stopped

volumes:
  ledger:
  mlflow:
